[project]
name = "driplytics-api"
version = "0.1.0"
description = "Driplytics HTTP API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "fsspec>=2024.10",
  "s3fs>=2024.10",
  "alembic>=1.14",
  "sqlalchemy>=2.0",
  "PyJWT[crypto]>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driplytics_api"]
