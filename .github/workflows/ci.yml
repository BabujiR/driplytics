# P0-20: every push to main and every pull request must pass all of this (ADR 0016).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python:
    name: Python (lint, types, tests incl. tenant isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: driplytics
          POSTGRES_PASSWORD: driplytics-dev
          POSTGRES_DB: driplytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U driplytics"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The database tests must RUN in CI, never silently skip (tests/db/conftest.py).
      DRIPLYTICS_REQUIRE_DB: "1"
      DRIPLYTICS_TEST_ADMIN_URL: postgresql://driplytics:driplytics-dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (exactly the committed uv.lock)
        run: uv sync --all-packages --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Cloud portability (ADR 0007)
        run: uv run python scripts/check_portability.py
      - name: Tests (engine, API, worker, database isolation, end-to-end import)
        run: uv run --all-packages pytest -ra
      - name: Engine throughput smoke (1 day x 100 tags)
        run: uv run python engine/scripts/benchmark.py --days 1

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint test
      - name: Typecheck shared packages
        run: pnpm turbo run typecheck --filter=!@driplytics/web
      - name: Build web (also type-checks the app)
        run: pnpm --filter @driplytics/web build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
