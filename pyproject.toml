# Driplytics Python workspace root (virtual: no package of its own). See ADR 0002.
#   uv sync --all-packages       install everything
#   uv run --all-packages pytest run all Python tests

[tool.uv.workspace]
members = ["apps/api", "services/worker", "engine"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "apps/api/tests", "services/worker/tests"]
addopts = "--import-mode=importlib -q"
markers = ["db: needs PostgreSQL (docker compose up -d postgres); skipped when it is not reachable"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  # FastAPI's TestClient still uses httpx; Starlette now warns about it. Remove once FastAPI updates.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/node_modules", "**/.next", "engine/tests/fixtures/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
# SQL-heavy files: long SQL lines read better unwrapped
"apps/api/tests/db/conftest.py" = ["E501"]
"apps/api/src/driplytics_api/db/migrate.py" = ["E501"]
"apps/api/scripts/*" = ["S310"]  # local-dev helper calling http://localhost only

[tool.ruff.lint.isort]
known-first-party = ["driplytics_api", "driplytics_worker", "driplytics_engine"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src", "services/worker/src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["arq.*", "s3fs.*", "fsspec.*", "driplytics_engine.*"]
ignore_missing_imports = true
