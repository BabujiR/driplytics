[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driplytics-engine"
version = "0.2.0"
description = "Driplytics engine: historian export importer and clamp-on valve leak-by check"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "fsspec>=2024.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
