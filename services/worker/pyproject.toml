[project]
name = "driplytics-worker"
version = "0.1.0"
description = "Driplytics background worker (Arq): imports, checks, reports"
requires-python = ">=3.12"
dependencies = [
  "arq>=0.26",
  "watchfiles>=0.24",  # arq --watch (hot reload in local dev)
  "pydantic-settings>=2.6",
  "plant-ingest",
]

[tool.uv.sources]
plant-ingest = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driplytics_worker"]
